<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  O DANFSe do Padrão Nacional (layout FortesReport da ACBr) escreve os valores
  em "Microsoft Sans Serif", que não existe no Linux. Sem esta regra o
  fontconfig cai na DejaVu Sans, mais larga: os valores saem com outra cara e o
  FortesReport mede o texto com a fonte errada. O fonts-liberation já mapeia
  Arial para Liberation Sans, que tem as mesmas métricas; aqui a Microsoft Sans
  Serif, desenho da mesma família, segue o mesmo caminho.
-->
<fontconfig>
  <alias binding="same">
    <family>Microsoft Sans Serif</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <!-- Nome PostScript, sem espaços: é como o PDF do FortesReport a cita, e é
       por ele que quem reprocessa o PDF procura a fonte. -->
  <alias binding="same">
    <family>MicrosoftSansSerif</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>MS Sans Serif</family>
    <accept><family>Liberation Sans</family></accept>
  </alias>
</fontconfig>
